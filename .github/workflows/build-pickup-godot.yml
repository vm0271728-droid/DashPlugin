name: Build Pickup Godot APK

on:
  push:
    branches:
      - tmp/pickup-godot-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          rm -rf project out
          mkdir -p project out
          unzip -q pickup_project.zip -d project
          rm -rf project/.github

      - name: Patch project for Godot 4.7
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # The previous APK was installable but the exported main script had
          # GDScript type-inference parse errors. Godot still produced an APK,
          # which is why it launched to an empty black/gray screen.
          for gd in Path('project').rglob('*.gd'):
              text = gd.read_text(encoding='utf-8')
              text = text.replace(':=', '=')
              gd.write_text(text, encoding='utf-8')

          preset = Path('project/export_presets.cfg')
          text = preset.read_text(encoding='utf-8')
          lines = []
          for line in text.splitlines():
              if line.startswith('gradle_build/min_sdk='):
                  continue
              if line.startswith('gradle_build/target_sdk='):
                  continue
              lines.append(line)
          preset.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          project = Path('project/project.godot')
          text = project.read_text(encoding='utf-8')

          if '[application]' not in text:
              text += '\n[application]\n'
          if 'config/icon=' not in text:
              pos = text.index('[application]') + len('[application]')
              text = text[:pos] + '\nconfig/icon="res://icon.svg"' + text[pos:]

          if '[display]' not in text:
              text += '\n[display]\n'
          display_lines = {
              'window/size/viewport_width': '1280',
              'window/size/viewport_height': '720',
              'window/stretch/mode': '"canvas_items"',
              'window/handheld/orientation': '1',
          }
          for key, value in display_lines.items():
              if key not in text:
                  pos = text.index('[display]') + len('[display]')
                  text = text[:pos] + f'\n{key}={value}' + text[pos:]

          if '[rendering]' not in text:
              text += '\n[rendering]\n'
          rendering_lines = {
              'renderer/rendering_method': '"gl_compatibility"',
              'renderer/rendering_method.mobile': '"gl_compatibility"',
              'textures/vram_compression/import_etc2_astc': 'true',
          }
          for key, value in rendering_lines.items():
              if key not in text:
                  pos = text.index('[rendering]') + len('[rendering]')
                  text = text[:pos] + f'\n{key}={value}' + text[pos:]

          project.write_text(text, encoding='utf-8')

          # Text SVG icon so the build has a real launcher icon without binary tooling.
          Path('project/icon.svg').write_text('''<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101820"/><stop offset="1" stop-color="#263746"/></linearGradient></defs>
          <rect width="512" height="512" rx="112" fill="url(#g)"/>
          <path d="M86 302h32l26-78c6-18 20-30 39-30h133c16 0 30 8 39 21l43 63h28c13 0 24 11 24 24v42h-32c-6-33-35-58-70-58s-64 25-70 58H218c-6-33-35-58-70-58s-64 25-70 58H62v-18c0-13 11-24 24-24z" fill="#e8eef4"/>
          <circle cx="148" cy="348" r="43" fill="#0b1117" stroke="#6fd3ff" stroke-width="14"/>
          <circle cx="348" cy="348" r="43" fill="#0b1117" stroke="#6fd3ff" stroke-width="14"/>
          <path d="M188 196h92v74h-118l20-59c2-7 4-11 6-15zm111 0h17c9 0 16 4 21 11l42 63h-80v-74z" fill="#6fd3ff" opacity=".9"/>
          <path d="M252 334l-24 48m56-48l-24 48" stroke="#ff9e3d" stroke-width="13" stroke-linecap="round"/>
          </svg>''', encoding='utf-8')
          PY

          echo '--- Patched GDScript inference operators ---'
          grep -RIn ':=' project --include='*.gd' || true
          echo '--- Main scene ---'
          grep -n 'run/main_scene' project/project.godot || true
          echo '--- Icon ---'
          grep -n 'config/icon' project/project.godot || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          wget -q --show-progress https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Install Godot Android export templates
        shell: bash
        run: |
          wget -q --show-progress https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q Godot_v4.7.1-stable_export_templates.tpz -d /tmp/godot_templates
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.7.1.stable/android_debug.apk"

      - name: Prepare debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Import project with Godot
        shell: bash
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"
          ./godot --headless --editor --path project --quit-after 8 2>&1 | tee out/godot-import.log

      - name: Runtime preflight
        shell: bash
        run: |
          set -o pipefail
          set +e
          ./godot --headless --path project --quit-after 5 --verbose 2>&1 | tee out/runtime-preflight.log
          RC=${PIPESTATUS[0]}
          set -e
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' out/runtime-preflight.log; then
            echo 'Runtime preflight found a script error.'
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "Godot runtime preflight exited with code $RC"
            exit "$RC"
          fi

      - name: Build APK with Godot
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          cp "$HOME/.android/debug.keystore" "$GITHUB_WORKSPACE/debug.keystore"
          set -o pipefail
          ./godot --headless --path project --verbose --export-debug "Android" "$GITHUB_WORKSPACE/out/Pickup_Suspension_Test_Godot_fixed.apk" 2>&1 | tee "$GITHUB_WORKSPACE/out/godot-export.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' "$GITHUB_WORKSPACE/out/godot-export.log"; then
            echo 'Export log contains script errors.'
            exit 1
          fi
          test -s "$GITHUB_WORKSPACE/out/Pickup_Suspension_Test_Godot_fixed.apk"
          unzip -t "$GITHUB_WORKSPACE/out/Pickup_Suspension_Test_Godot_fixed.apk" >/dev/null
          ls -lh "$GITHUB_WORKSPACE/out/Pickup_Suspension_Test_Godot_fixed.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs out/Pickup_Suspension_Test_Godot_fixed.apk | tee out/apksigner.txt

      - name: Upload APK and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pickup-Suspension-Test-Godot-FIXED
          path: |
            out/Pickup_Suspension_Test_Godot_fixed.apk
            out/godot-import.log
            out/runtime-preflight.log
            out/godot-export.log
            out/apksigner.txt
          if-no-files-found: warn
          retention-days: 7
