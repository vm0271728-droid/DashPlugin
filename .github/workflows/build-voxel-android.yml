name: Build Voxel Survival Android

on:
  push:
    branches:
      - voxel-apk-build
    paths:
      - 'voxel_survival_godot/**'
      - '.github/workflows/build-voxel-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Generate original procedural assets
        run: python3 voxel_survival_godot/ci_generate_assets.py

      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          curl -fL --retry 5 --retry-delay 3 \
            -o /tmp/templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          rm -rf /tmp/export-templates
          mkdir -p /tmp/export-templates
          unzip -q /tmp/templates.tpz -d /tmp/export-templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/export-templates/templates/. "$TEMPLATE_DIR/"
          printf '4.3.stable\n' > "$TEMPLATE_DIR/version.txt"
          godot --version
          test -f "$TEMPLATE_DIR/android_debug.apk"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import and launch-check project
        shell: bash
        working-directory: voxel_survival_godot
        run: |
          set -euxo pipefail
          godot --headless --editor --path . --quit-after 20 2>&1 | tee /tmp/godot-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" /tmp/godot-import.log
          godot --headless --path . --quit-after 10 2>&1 | tee /tmp/godot-run.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" /tmp/godot-run.log

      - name: Export Android APK
        shell: bash
        working-directory: voxel_survival_godot
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.ci-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euxo pipefail
          cp "$HOME/.android/debug.keystore" "$GITHUB_WORKSPACE/.ci-debug.keystore"
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/VoxelSurvival.apk
          test -s build/VoxelSurvival.apk
          file build/VoxelSurvival.apk
          unzip -t build/VoxelSurvival.apk >/dev/null
          sha256sum build/VoxelSurvival.apk | tee build/VoxelSurvival.apk.sha256
          ls -lh build/VoxelSurvival.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxelSurvival-APK
          path: voxel_survival_godot/build/VoxelSurvival.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
